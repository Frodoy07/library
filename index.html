<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Library</title>
  </head>
  <body>
    <div>
      <h1 class="edu-nsw-act-cursive-Edu">My Library</h1>
      <button type="button" id="addBook">+ Add New Book</button>
    </div>
    <div class="modal hidden">
      <form action="">
        <div>
          <label for="title">Title</label>
          <input type="text" name="title" id="title" />
        </div>
        <div>
          <label for="author">Author</label>
          <input type="text" name="author" id="author" />
        </div>
        <div>
          <label for="pages">Pages</label>
          <input type="number" name="pages" id="pages" />
        </div>
        <div>
          <input
            type="radio"
            name="read"
            id="read"
            data-wasChecked="true"
            checked
          />
          <label for="read">Read</label>
        </div>
        <button type="submit" id="submitBook">Add</button>
      </form>
    </div>
    <div class="container">
      <div class="card">
        <div>
          <h3>Title:</h3>
          <p>The Atomic Habits</p>
        </div>
        <div>
          <h3>Author:</h3>
          <p>James Clear</p>
        </div>
        <div>
          <h3>Pages:</h3>
          <p>246</p>
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
