<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/1f1d30e887.js"
      crossorigin="anonymous"
    ></script>
    <title>Library</title>
  </head>
  <body>
    <div>
      <h1 class="edu-nsw-act-cursive-Edu">My Library</h1>
      <button type="button" id="addBook">+ Add New Book</button>
    </div>
    <div class="modal hidden">
      <form>
        <div class="close-btn">
          <i class="fa-solid fa-square-xmark"></i>
        </div>
        <div>
          <label for="title">Title</label>
          <input type="text" name="title" id="title" required />
        </div>
        <div>
          <label for="author">Author</label>
          <input type="text" name="author" id="author" required />
        </div>
        <div>
          <label for="pages">Pages</label>
          <input type="number" name="pages" id="pages" required />
        </div>
        <div>
          <input type="radio" name="read" id="read" data-wasChecked="true" />
          <label for="read">Read</label>
        </div>
        <button type="submit" id="submitBook">Add</button>
      </form>
    </div>
    <div class="container"></div>
    <script src="scripts.js"></script>
  </body>
</html>
